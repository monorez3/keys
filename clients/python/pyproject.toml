[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monokeys"
version = "0.3.0"
description = "Small smart functions in one call: Telegram link checks, weather, rates, wiki — no API keys, no dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Monoblock" }]
keywords = ["telegram", "api", "search", "weather", "currency", "wikipedia", "mcp", "utilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
# Зависимостей нет и не будет: весь клиент — обёртка над стандартной библиотекой.
dependencies = []

[project.urls]
Homepage = "https://monoblock.casa/keys/"
Documentation = "https://monoblock.casa/keys/client"
Repository = "https://github.com/monorez3/keys"

[tool.hatch.build.targets.wheel]
packages = ["monokeys"]
